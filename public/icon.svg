<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Notebook Base Silhouette -->
  <rect x="96" y="80" width="320" height="352" rx="24" fill="#1e293b" stroke="#475569" stroke-width="6" />
  
  <!-- Notebook Spine -->
  <path d="M96 104 C96 90.7 106.7 80 120 80 L144 80 L144 432 L120 432 C106.7 432 96 421.3 96 408 Z" fill="#312e81" />
  <circle cx="120" cy="140" r="10" fill="#0f172a" stroke="#6366f1" stroke-width="4" />
  <circle cx="120" cy="256" r="10" fill="#0f172a" stroke="#6366f1" stroke-width="4" />
  <circle cx="120" cy="372" r="10" fill="#0f172a" stroke="#6366f1" stroke-width="4" />
  
  <!-- Pages Graphic -->
  <line x1="176" y1="140" x2="360" y2="140" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <line x1="176" y1="180" x2="320" y2="180" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  <line x1="176" y1="220" x2="340" y2="220" stroke="#475569" stroke-width="5" stroke-linecap="round" />
  
  <!-- Glowing S Pen / Stylus Stroke -->
  <path d="M220 370 Q 270 290 320 330 T 400 240" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Stylus Nib -->
  <g transform="translate(370, 180) rotate(45)">
    <polygon points="0,0 24,12 24,-12" fill="#06b6d4" />
    <rect x="24" y="-10" width="80" height="20" rx="4" fill="url(#grad1)" />
    <circle cx="10" cy="0" r="4" fill="#ffffff" />
  </g>
  
  <!-- Sanskrit / Grandham Symbol Emblem -->
  <text x="256" y="475" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="6">GRANDHAM</text>
</svg>
